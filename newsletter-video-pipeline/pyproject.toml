[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "newsletter-video-pipeline"
version = "1.0.0"
description = "Self-hosted newsletter to video automation pipeline with AI avatar and voice cloning"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "XSPO Alliance"}
]
keywords = ["video", "automation", "ai", "avatar", "voice-cloning", "newsletter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "aiofiles>=23.2.1",
    "python-multipart>=0.0.6",
    "redis>=5.0.0",
    "celery>=5.3.0",
    "moviepy>=1.0.3",
    "Pillow>=10.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "librosa>=0.10.1",
    "soundfile>=0.12.1",
    "ffmpeg-python>=0.2.0",
    "yt-dlp>=2024.1.0",
    "google-api-python-client>=2.114.0",
    "google-auth-oauthlib>=1.2.0",
    "tweepy>=4.14.0",
    "instagrapi>=2.0.0",
    "TikTokApi>=6.3.0",
    "jinja2>=3.1.3",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.2",
    "prometheus-client>=0.19.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "torchvision>=0.17.0",
    "transformers>=4.37.0",
    "accelerate>=0.26.0",
    "safetensors>=0.4.1",
    "opencv-python>=4.9.0",
    "mediapipe>=0.10.9",
    "onnxruntime-gpu>=1.16.0",
]

dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=24.1.0",
    "ruff>=0.1.14",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
nvp-api = "services.api_gateway.main:main"
nvp-worker = "services.worker:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["services*", "configs*"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311']

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
