# ============================================================
# Newsletter Video Pipeline - Production Docker Compose
# ============================================================
# Full stack deployment for Linux VM orchestration server
# ============================================================

version: '3.8'

services:
  # ============================================================
  # Database
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: nvp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nvp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nvp_password}
      POSTGRES_DB: ${POSTGRES_DB:-newsletter_video_pipeline}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nvp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nvp-network

  # ============================================================
  # Redis (Message Broker & Cache)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: nvp-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nvp-network

  # ============================================================
  # API Gateway
  # ============================================================
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: nvp-api-gateway
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-nvp}:${POSTGRES_PASSWORD:-nvp_password}@postgres:5432/${POSTGRES_DB:-newsletter_video_pipeline}
      - REDIS_URL=redis://redis:6379
      - GPU_HOST=${GPU_HOST:-192.168.1.100}
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - VOICE_CLONER_URL=http://${GPU_HOST:-192.168.1.100}:5002
      - AVATAR_GENERATOR_URL=http://${GPU_HOST:-192.168.1.100}:5003
      - VIDEO_PROCESSOR_URL=http://video-processor:5005
      - SOCIAL_PUBLISHER_URL=http://social-publisher:5006
      - SCRIPT_GENERATOR_URL=http://script-generator:5007
    volumes:
      - ./data:/app/data
      - ./logs/api-gateway:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - nvp-network

  # ============================================================
  # Video Processor
  # ============================================================
  video-processor:
    build:
      context: ./services/video-processor
      dockerfile: Dockerfile
    container_name: nvp-video-processor
    restart: unless-stopped
    environment:
      - TEMP_DIR=/tmp/video_processor
    volumes:
      - ./data/videos:/app/videos
      - video_temp:/tmp/video_processor
      - ./logs/video-processor:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - nvp-network

  # ============================================================
  # Social Publisher
  # ============================================================
  social-publisher:
    build:
      context: ./services/social-publisher
      dockerfile: Dockerfile
    container_name: nvp-social-publisher
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-nvp}:${POSTGRES_PASSWORD:-nvp_password}@postgres:5432/${POSTGRES_DB:-newsletter_video_pipeline}
      - YOUTUBE_CLIENT_ID=${YOUTUBE_CLIENT_ID}
      - YOUTUBE_CLIENT_SECRET=${YOUTUBE_CLIENT_SECRET}
      - TIKTOK_CLIENT_KEY=${TIKTOK_CLIENT_KEY}
      - TIKTOK_CLIENT_SECRET=${TIKTOK_CLIENT_SECRET}
      - INSTAGRAM_APP_ID=${INSTAGRAM_APP_ID}
      - INSTAGRAM_APP_SECRET=${INSTAGRAM_APP_SECRET}
      - X_API_KEY=${X_API_KEY}
      - X_API_SECRET=${X_API_SECRET}
    volumes:
      - ./data/videos:/app/videos:ro
      - ./logs/social-publisher:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - nvp-network

  # ============================================================
  # Script Generator
  # ============================================================
  script-generator:
    build:
      context: ./services/script-generator
      dockerfile: Dockerfile
    container_name: nvp-script-generator
    restart: unless-stopped
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-local}
      - LLM_MODEL=${LLM_MODEL:-qwen2.5:7b}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ./logs/script-generator:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5007/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - nvp-network

  # ============================================================
  # Celery Workers
  # ============================================================
  celery-worker-pipeline:
    build:
      context: .
      dockerfile: workers/Dockerfile
    container_name: nvp-celery-pipeline
    restart: unless-stopped
    command: celery -A workers.celery_app worker -Q pipeline -c 2 -l info
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-nvp}:${POSTGRES_PASSWORD:-nvp_password}@postgres:5432/${POSTGRES_DB:-newsletter_video_pipeline}
      - REDIS_URL=redis://redis:6379
      - GPU_HOST=${GPU_HOST:-192.168.1.100}
    volumes:
      - ./data:/app/data
      - ./logs/celery:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nvp-network

  celery-worker-video:
    build:
      context: .
      dockerfile: workers/Dockerfile
    container_name: nvp-celery-video
    restart: unless-stopped
    command: celery -A workers.celery_app worker -Q video -c 2 -l info
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-nvp}:${POSTGRES_PASSWORD:-nvp_password}@postgres:5432/${POSTGRES_DB:-newsletter_video_pipeline}
      - REDIS_URL=redis://redis:6379
      - GPU_HOST=${GPU_HOST:-192.168.1.100}
    volumes:
      - ./data:/app/data
      - ./logs/celery:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nvp-network

  celery-worker-publish:
    build:
      context: .
      dockerfile: workers/Dockerfile
    container_name: nvp-celery-publish
    restart: unless-stopped
    command: celery -A workers.celery_app worker -Q publish -c 4 -l info
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-nvp}:${POSTGRES_PASSWORD:-nvp_password}@postgres:5432/${POSTGRES_DB:-newsletter_video_pipeline}
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./data:/app/data
      - ./logs/celery:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nvp-network

  celery-beat:
    build:
      context: .
      dockerfile: workers/Dockerfile
    container_name: nvp-celery-beat
    restart: unless-stopped
    command: celery -A workers.celery_app beat -l info
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-nvp}:${POSTGRES_PASSWORD:-nvp_password}@postgres:5432/${POSTGRES_DB:-newsletter_video_pipeline}
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - nvp-network

  # ============================================================
  # Frontend
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    container_name: nvp-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - nvp-network

  # ============================================================
  # Nginx Reverse Proxy
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: nvp-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./certbot/www:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - api-gateway
      - frontend
    networks:
      - nvp-network

  # ============================================================
  # Monitoring - Prometheus
  # ============================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: nvp-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    networks:
      - nvp-network

  # ============================================================
  # Monitoring - Grafana
  # ============================================================
  grafana:
    image: grafana/grafana:latest
    container_name: nvp-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - nvp-network

  # ============================================================
  # Logging - Loki
  # ============================================================
  loki:
    image: grafana/loki:latest
    container_name: nvp-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki:/etc/loki:ro
      - loki_data:/loki
    networks:
      - nvp-network

  # ============================================================
  # Logging - Promtail
  # ============================================================
  promtail:
    image: grafana/promtail:latest
    container_name: nvp-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./monitoring/promtail:/etc/promtail:ro
      - ./logs:/var/log/nvp:ro
      - nginx_logs:/var/log/nginx:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    networks:
      - nvp-network

  # ============================================================
  # Exporters
  # ============================================================
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: nvp-redis-exporter
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://redis:6379
    depends_on:
      - redis
    networks:
      - nvp-network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: nvp-postgres-exporter
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-nvp}:${POSTGRES_PASSWORD:-nvp_password}@postgres:5432/${POSTGRES_DB:-newsletter_video_pipeline}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nvp-network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: nvp-node-exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - nvp-network

# ============================================================
# Networks
# ============================================================
networks:
  nvp-network:
    driver: bridge

# ============================================================
# Volumes
# ============================================================
volumes:
  postgres_data:
  redis_data:
  video_temp:
  prometheus_data:
  grafana_data:
  loki_data:
  nginx_logs:
