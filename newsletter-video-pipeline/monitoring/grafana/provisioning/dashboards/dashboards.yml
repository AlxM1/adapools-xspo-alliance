# Newsletter Video Pipeline - Grafana Dashboard Provisioning
apiVersion: 1

providers:
  - name: 'Newsletter Video Pipeline'
    orgId: 1
    folder: 'NVP'
    folderUid: 'nvp'
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
